name: CI-CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  ci:
    name: CI
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f index.html
          test -f Dockerfile
          echo "Project files are present"

      - name: Build Docker image
        run: docker build -t sweet-crumbs .

  cd:
    name: CD
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sweet-crumbs .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        run: docker tag sweet-crumbs ${{ secrets.DOCKERHUB_USERNAME }}/sweet-crumbs:latest

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/sweet-crumbs:latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster sweet-crumbs-cluster \
            --service sweet-crumbs-service \
            --force-new-deployment